<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arianne — Opening Preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08090b;color:#efdec1;font:14px Consolas,monospace;display:grid;min-height:100vh;place-content:center;padding:24px}main{width:min(1120px,95vw)}canvas{display:block;width:100%;height:auto;background:#000;image-rendering:pixelated;box-shadow:0 0 0 1px #282420}footer{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding-top:18px}button{font:inherit;background:#191716;color:#efdec1;border:1px solid #5b4d3b;padding:10px 16px;cursor:pointer}button:hover{border-color:#61bdff}#status{color:#a99a85;margin-left:auto}small{display:block;color:#8f867b;margin-top:14px}
</style>
<main><canvas id="film" width="1280" height="720" aria-label="Arianne opening cinematic"></canvas><footer><button id="play">Play</button><button id="restart">Restart</button><button id="next">Next scene</button><button id="sound">Sound on</button><span id="status">Loading artwork…</span></footer><small>Enter / Space: reveal text or advance · Esc: finish · Duration: 37 seconds</small></main>
<script src="opening-data.js"></script><script>
const D=window.OPENING_DATA,C=document.querySelector('canvas'),g=C.getContext('2d'),status=document.querySelector('#status');
let images=[],audioBuffer,audioContext,audioSource,audioGain,audioDestination,elapsed=0,playing=false,previous=0,forceText=false,lastScene=-1,muted=false,exportMode=false;
const sceneIndex=t=>D.scenes.findIndex(s=>t>=s.start&&t<s.end);
async function load(){images=await Promise.all(D.scenes.map(s=>new Promise((resolve,reject)=>{let i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=s.image;})));document.fonts&&await document.fonts.ready;status.textContent='Ready · 00:37';render(0);window.openingReady=true;}
async function setupAudio(){if(audioContext)return;audioContext=new AudioContext();const raw=await (await fetch(D.audio)).arrayBuffer();audioBuffer=await audioContext.decodeAudioData(raw);audioGain=audioContext.createGain();audioGain.gain.value=muted?0:1;audioGain.connect(audioContext.destination);audioDestination=audioContext.createMediaStreamDestination();audioGain.connect(audioDestination);}
function stopAudio(){if(audioSource){try{audioSource.stop();}catch{}audioSource.disconnect();audioSource=null;}}
async function startAudio(at){await setupAudio();await audioContext.resume();stopAudio();if(at>=D.duration)return;audioSource=audioContext.createBufferSource();audioSource.buffer=audioBuffer;audioSource.connect(audioGain);audioSource.start(0,Math.max(0,at));}
function render(t){g.globalAlpha=1;g.fillStyle='#000';g.fillRect(0,0,1280,720);const index=sceneIndex(t);if(index<0)return;const s=D.scenes[index],local=t-s.start;if(index!==lastScene){lastScene=index;forceText=false;}const opacity=Math.max(0,Math.min(1,local/.4,(s.duration-local)/.4));g.globalAlpha=opacity;g.imageSmoothingEnabled=false;let dx=0,dy=0;if(index===2&&local>1&&local<1.3){dx=Math.round(Math.sin(local*94)*2);dy=Math.round(Math.cos(local*77));}g.drawImage(images[index],160+dx,30+dy,960,480);g.fillStyle=D.palette.text;g.font='30px Consolas, "Courier New", monospace';g.textAlign='center';g.textBaseline='top';let available=forceText?9999:Math.floor(Math.max(0,local-.28)*32);s.lines.forEach((line,j)=>{let chars=Array.from(line),count=Math.max(0,Math.min(chars.length,available));g.fillText(chars.slice(0,count).join(''),640,568+j*43);available-=chars.length;});g.globalAlpha=1;}
function tick(now){if(playing){elapsed=Math.min(D.duration,elapsed+(now-previous)/1000);render(elapsed);if(elapsed>=D.duration){playing=false;stopAudio();document.querySelector('#play').textContent='Replay';}}previous=now;status.textContent=String(Math.floor(elapsed)).padStart(2,'0')+' / 37 s';if(!exportMode)requestAnimationFrame(tick);}
async function play(){if(!window.openingReady)return;if(playing){playing=false;stopAudio();document.querySelector('#play').textContent='Resume';return;}if(elapsed>=D.duration){elapsed=0;lastScene=-1;}await startAudio(elapsed);previous=performance.now();playing=true;document.querySelector('#play').textContent='Pause';}
async function advance(){let i=sceneIndex(elapsed);if(i>=0){const s=D.scenes[i],len=s.lines.join('').length;if(!forceText&&Math.floor(Math.max(0,elapsed-s.start-.28)*32)<len){forceText=true;render(elapsed);return;}elapsed=s.end;}else if(elapsed<.8)elapsed=.8;else elapsed=0;lastScene=-1;render(elapsed);if(playing)await startAudio(elapsed);}
document.querySelector('#play').onclick=play;document.querySelector('#restart').onclick=async()=>{elapsed=0;lastScene=-1;render(0);if(playing)await startAudio(0);else await play();};document.querySelector('#next').onclick=advance;document.querySelector('#sound').onclick=()=>{muted=!muted;if(audioGain)audioGain.gain.value=muted?0:1;document.querySelector('#sound').textContent=muted?'Sound off':'Sound on';};
document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();if(!playing&&elapsed===0)play();else advance();}if(e.code==='Escape'){elapsed=D.duration;playing=false;stopAudio();render(elapsed);}});
window.renderOpeningAt=t=>{elapsed=t;lastScene=-1;render(t);};
window.recordOpening=async()=>{await setupAudio();await audioContext.resume();exportMode=true;playing=false;stopAudio();elapsed=0;lastScene=-1;forceText=false;render(0);let mime='video/mp4;codecs=avc1.42001E,mp4a.40.2';if(!MediaRecorder.isTypeSupported(mime))mime='video/webm;codecs=vp9,opus';let visual=C.captureStream(30),stream=new MediaStream([...visual.getVideoTracks(),...audioDestination.stream.getAudioTracks()]),recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:4500000,audioBitsPerSecond:128000}),chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};recorder.onstop=async()=>{const blob=new Blob(chunks,{type:mime});const reader=new FileReader();reader.onload=()=>{window.recordingResult={data:reader.result.split(',').pop(),mime,size:blob.size};};reader.readAsDataURL(blob);visual.getTracks().forEach(t=>t.stop());};recorder.start(1000);let start=performance.now();await startAudio(0);function draw(now){let t=Math.min(D.duration,(now-start)/1000);render(t);if(t<D.duration)requestAnimationFrame(draw);else{stopAudio();setTimeout(()=>recorder.stop(),120);}}requestAnimationFrame(draw);};
load().catch(e=>{status.textContent='Loading error: '+e.message;window.openingError=e.message;});requestAnimationFrame(tick);
</script></html>
